name: strike-desk

on:
  push:
    paths: ["strike_desk/**", ".github/workflows/strike-desk-ci.yml"]
  pull_request:
    paths: ["strike_desk/**", ".github/workflows/strike-desk-ci.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strike_desk
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Structural gates
        run: |
          uv run pytest \
            tests/test_decline_taxonomy.py \
            tests/test_journal_migration.py \
            tests/test_playbook.py \
            tests/test_risk_officer.py \
            tests/test_risk_scenarios.py \
            tests/test_options_strategist.py::test_every_whitelisted_tool_is_a_reader \
            tests/test_options_strategist.py::test_no_whitelist_holds_a_mutating_tool \
            tests/test_tick_adjudication.py::test_enter_requires_a_cleared_verdict \
            tests/test_tick_adjudication.py::test_no_write_path_is_ever_touched \
            -q

      - name: Guardrail and regression gate
        run: |
          uv run pytest tests/test_guardrails.py tests/test_guardrails_regime.py \
                        tests/test_guardrails_execution.py tests/regression -q

      - name: Full suite with coverage
        run: uv run pytest --cov=strike_desk --cov-report=term-missing --cov-fail-under=80

      - name: Security scan
        run: |
          uv run bandit -q -r src
          uv run pip-audit

  evals:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: strike_desk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the reasoning plane changed
        id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > /tmp/changed.txt
          if grep -qE 'strike_desk/src/strike_desk/(prompts/|regime_analyst|grounding|model_client)' /tmp/changed.txt \
             || grep -q 'strike_desk/tests/evals/' /tmp/changed.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.changed.outputs.run == 'true'
        with:
          enable-cache: true

      - name: Install and run the regime evals
        if: steps.changed.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv python install 3.12
          uv sync --group dev
          uv run pytest tests/evals -m evals -q
