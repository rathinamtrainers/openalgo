# desk.zerotouchalgo.com — OpenAlgo UI. Gunicorn stays on 127.0.0.1:5000.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name desk.zerotouchalgo.com lab.zerotouchalgo.com ltp.zerotouchalgo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name desk.zerotouchalgo.com lab.zerotouchalgo.com ltp.zerotouchalgo.com;

    ssl_certificate     /etc/letsencrypt/live/desk.zerotouchalgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desk.zerotouchalgo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /public-brief.json {
        alias /var/lib/strike-desk/public-brief.json;
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "https://zerotouchalgo.com";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    location = /public-brief-banknifty.json {
        alias /var/lib/strike-desk/public-brief-banknifty.json;
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "https://zerotouchalgo.com";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    location = /public-brief-sensex.json {
        alias /var/lib/strike-desk/public-brief-sensex.json;
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "https://zerotouchalgo.com";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    location = /public-brief-btc-options.json {
        alias /var/lib/strike-desk/public-brief-btc-options.json;
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "https://zerotouchalgo.com";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    location = /public-brief-crudeoil.json {
        alias /var/lib/strike-desk/public-brief-crudeoil.json;
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "https://zerotouchalgo.com";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    location = /public-brief-natgas.json {
        alias /var/lib/strike-desk/public-brief-natgas.json;
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "https://zerotouchalgo.com";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    location = /coa-alert {
        alias /var/lib/strike-desk/coa-alert.html;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /coa-alert.html {
        alias /var/lib/strike-desk/coa-alert.html;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location = /tick-status {
        alias /var/lib/strike-desk/desk-health-ticks.html;
        default_type text/html;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /tick-status.html {
        alias /var/lib/strike-desk/desk-health-ticks.html;
        default_type text/html;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /tick-status.jsonl {
        alias /var/lib/strike-desk/desk-health-ticks.jsonl;
        default_type application/x-ndjson;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /ledger {
        alias /var/lib/zta-desk/public/index.html;
        default_type text/html;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "https://zerotouchalgo.com";
    }

    location /ledger/ {
        alias /var/lib/zta-desk/ledger/;
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "https://zerotouchalgo.com";
    }

    if ($host = lab.zerotouchalgo.com) {
        rewrite ^/$ /greekslab redirect;
    }
    if ($host = ltp.zerotouchalgo.com) {
        rewrite ^/$ /greekslab redirect;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_read_timeout 86400;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
